<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Marquez les moments forts d’un live pour les retrouver dans la VOD."><title>Marqueur VOD</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><script defer src="js/i18n.js"></script><script defer src="js/timecode.js"></script><script defer src="js/storage.js"></script><script defer src="js/twitch.js"></script><script defer src="js/export.js"></script><script defer src="js/shortcuts.js"></script><script defer src="js/app.js"></script></head><body>
<header class="topbar"><div><p class="eyebrow" data-i18n="tagline"></p><h1 data-i18n="appTitle"></h1></div><div class="top-controls"><label for="language" data-i18n="languageLabel"></label><select id="language" data-i18n-aria-label="languageLabel"><option value="fr">Français</option><option value="en">English</option></select><button id="themeToggle" class="button subtle" type="button" data-i18n="themeDark"></button></div></header><main>
<section class="card"><h2 data-i18n="sessionSetup"></h2><div class="field-grid"><div class="field"><label for="channel" data-i18n="channelLabel"></label><input id="channel" maxlength="25" autocomplete="off" data-i18n-placeholder="channelPlaceholder"></div><div class="field"><label for="mode" data-i18n="modeLabel"></label><select id="mode"><option value="api" data-i18n="modeApi"></option><option value="manual" data-i18n="modeManual"></option><option value="local" data-i18n="modeLocal"></option></select></div></div>
<div id="apiSettings" class="mode-panel"><div class="button-row"><button id="connectApi" class="button secondary" type="button" data-i18n="connectApi"></button><button id="disconnectApi" class="button subtle" type="button" data-i18n="disconnectApi" hidden></button></div><p id="authStatus" class="hint" data-i18n="apiPrivacy"></p><p id="streamInfo" class="hint" aria-live="polite" hidden></p></div>
<div id="manualSettings" class="mode-panel" hidden><div class="field-grid"><div class="field"><label for="manualValue" data-i18n="manualValueLabel"></label><input id="manualValue" autocomplete="off" data-i18n-placeholder="manualValuePlaceholder"></div><div class="field"><label for="manualType" data-i18n="manualTypeLabel"></label><select id="manualType"><option value="elapsed" data-i18n="manualElapsed"></option><option value="start" data-i18n="manualStart"></option></select></div></div><button id="resync" class="button secondary" type="button" data-i18n="resync"></button></div>
<div id="localSettings" class="mode-panel" hidden><div class="field-grid"><div class="field"><label for="localOffset" data-i18n="localOffsetLabel"></label><input id="localOffset" inputmode="numeric" value="00:00:00" data-i18n-placeholder="timecodePlaceholder"></div><button id="startLocal" class="button secondary align-end" type="button" data-i18n="startLocal"></button></div></div><div class="status-line"><span id="status" role="status" aria-live="polite" data-i18n="statusReady"></span><span id="reliability" class="badge" data-i18n="reliabilityNone"></span></div></section>
<section class="card clock-card" aria-label="" data-i18n-aria-label="currentTimecode"><p class="eyebrow" data-i18n="currentTimecode"></p><output id="currentTimecode" class="clock">00:00:00</output><div class="field-grid compact-grid"><div class="field"><label for="subtractSeconds" data-i18n="subtractLabel"></label><input id="subtractSeconds" type="number" min="0" max="3600" value="10"></div><div class="field"><label for="shortcutKey" data-i18n="shortcutLabel"></label><input id="shortcutKey" maxlength="1" value="M" data-i18n-placeholder="shortcutPlaceholder"></div></div><button id="markMoment" class="button mark-button" type="button" data-i18n="markMoment"></button></section>
<section class="card"><div class="section-heading"><div><h2 data-i18n="markersHeading"></h2><p id="markerCount" class="hint"></p></div><div class="button-row"><button id="undoDelete" class="button subtle" type="button" data-i18n="undoDelete" disabled></button><button id="clearSession" class="button danger" type="button" data-i18n="clearSession"></button></div></div><div id="markers" class="marker-list" aria-live="polite"></div><p id="emptyMarkers" class="empty-state" data-i18n="emptyMarkers"></p></section>
<section class="card"><h2 data-i18n="exportHeading"></h2><div class="options-row"><label class="check-label"><input id="exportDate" type="checkbox" checked><span data-i18n="includeDate"></span></label><label class="check-label"><input id="exportNotes" type="checkbox" checked><span data-i18n="includeNotes"></span></label><label class="check-label"><input id="exportHeader" type="checkbox" checked><span data-i18n="includeHeader"></span></label></div><div class="button-row"><button id="copyList" class="button secondary" type="button" data-i18n="copyList"></button><button id="downloadList" class="button secondary" type="button" data-i18n="downloadList"></button></div><div class="history-block"><h3 data-i18n="historyHeading"></h3><div class="history-row"><select id="historySelect" data-i18n-aria-label="historyHeading"><option value="" data-i18n="historyEmpty"></option></select><button id="loadHistory" class="button subtle" type="button" data-i18n="loadHistory"></button><button id="exportHistory" class="button subtle" type="button" data-i18n="exportHistory"></button></div></div></section>
<details class="card privacy-card"><summary data-i18n="settingsHeading"></summary><p data-i18n="privacyNotice"></p><p data-i18n="twitchDisclaimer"></p></details></main><footer data-i18n="footerLocal"></footer><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
